<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <style>
        body {
            background-color: transparent !important;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        #reloj {
            font-size: 52px;
            font-weight: 900;
            color: #FFFFFF;
            text-shadow: 3px 3px 6px #000000, -2px -2px 4px #000000, 0px 0px 10px #000000;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="reloj">00:00</div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let tiempo = parseInt(urlParams.get('seg')) || 0;

        function actualizarReloj() {
            let h = Math.floor(tiempo / 3600);
            let m = Math.floor((tiempo % 3600) / 60);
            let s = tiempo % 60;

            let texto = "";
            if (h > 0) {
                // Si pasa de 1 hora, muestra Horas:Minutos:Segundos
                texto = (h < 10 ? '0' : '') + h + ':' + 
                        (m < 10 ? '0' : '') + m + ':' + 
                        (s < 10 ? '0' : '') + s;
            } else {
                // Si es menor a 1 hora, muestra Minutos:Segundos
                texto = (m < 10 ? '0' : '') + m + ':' + 
                        (s < 10 ? '0' : '') + s;
            }

            document.getElementById('reloj').innerText = texto;
            
            if (tiempo > 0) {
                tiempo--;
            }
        }

        actualizarReloj();
        setInterval(actualizarReloj, 1000);
    </script>
</body>
</html>
