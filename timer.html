<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html, body { 
    margin: 0 !important; 
    padding: 0 !important; 
    background-color: transparent !important; 
    background: transparent !important;
    overflow: hidden !important; 
    width: 100vw; 
    height: 100vh; 
}
#t { 
    position: absolute;
    top: 5px;
    left: 5px;
    font: bold 72px Arial, sans-serif; 
    color: #ffffff; 
    text-align: left; 
    text-shadow: 2px 2px 4px #000, -2px -2px 4px #000; 
    margin: 0;
    padding: 0;
    background: transparent !important;
}
</style>
</head>
<body>
<div id="t">--:--</div>
<script>
var m = /[?&]seg=(\d+)/.exec(location.search);
var end = new Date().getTime() + (m ? parseInt(m[1], 10) : 0) * 1000;
function dos(n) { return (n < 10 ? '0' : '') + n; }
function f() {
  var r = Math.max(0, Math.round((end - new Date().getTime()) / 1000));
  var h = Math.floor(r / 3600), mi = Math.floor((r % 3600) / 60), s = r % 60;
  document.getElementById('t').innerHTML = (h > 0 ? h + ':' : '') + dos(mi) + ':' + dos(s);
}
f();
setInterval(f, 1000);
</script>
</body>
</html>
